<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Widget Météo — Capibara</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="compact">
  <div class="widget-container" id="widget-box">
    
    <!-- Loading State -->
    <div id="loading-state" class="empty-state">
      <div class="skeleton skeleton-title" style="margin: 0 auto 20px auto;"></div>
      <div class="skeleton skeleton-text" style="width: 80%; margin: 0 auto 10px auto;"></div>
      <div class="skeleton skeleton-text" style="width: 60%; margin: 0 auto 0 auto;"></div>
    </div>

    <!-- Empty State / Invitation to Configure -->
    <div id="empty-state" class="empty-state" style="display: none;">
      <div class="empty-icon">📍</div>
      <div class="empty-text">Aucune ville configurée pour ce tableau de bord.</div>
      <a href="settings.html" id="config-link" class="btn" style="text-decoration: none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        Configurer la ville
      </a>
    </div>

    <!-- Error State -->
    <div id="error-state" class="empty-state" style="display: none;">
      <div class="empty-icon" style="color: var(--text-error);">⚠️</div>
      <div class="empty-text" id="error-msg">Impossible de récupérer les données météo.</div>
      <button class="btn" onclick="window.location.reload()">Réessayer</button>
    </div>

    <!-- Active Weather Display -->
    <div id="weather-content" style="display: none;">
      <div class="weather-header">
        <div>
          <div class="weather-city" id="city-title">Chargement...</div>
          <div class="weather-date" id="date-label">Aujourd'hui</div>
        </div>
        <button onclick="fetchWeather()" style="background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; transition: var(--transition-smooth);" title="Rafraîchir">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
        </button>
      </div>

      <div class="weather-main">
        <div class="weather-icon-box" id="weather-icon">
          <!-- Dynamically inserted SVG -->
        </div>
        <div>
          <div class="weather-temp-container">
            <span class="weather-temp" id="temp-val">--</span>
            <span class="weather-unit">°C</span>
          </div>
          <div class="weather-desc" id="weather-desc">Dégagé</div>
        </div>
      </div>

      <!-- Current Metrics Grid -->
      <div class="weather-grid">
        <!-- Wind -->
        <div class="grid-item">
          <div class="grid-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"></path></svg>
          </div>
          <div class="grid-info">
            <span class="grid-label">Vent</span>
            <span class="grid-value" id="wind-val">-- km/h</span>
          </div>
        </div>
        <!-- Rain -->
        <div class="grid-item">
          <div class="grid-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v2M12 20v2m4.9-14.9-1.4 1.4m-7 7-1.4 1.4M20 12h-2M6 12H4m14.9 4.9-1.4-1.4m-7-7-1.4-1.4"></path></svg>
          </div>
          <div class="grid-info">
            <span class="grid-label">Précipitations</span>
            <span class="grid-value" id="rain-val">-- mm</span>
          </div>
        </div>
        <!-- Humidity -->
        <div class="grid-item">
          <div class="grid-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a7 7 0 0 0 7-7c0-4.3-7-11-7-11S5 10.7 5 15a7 7 0 0 0 7 7z"></path></svg>
          </div>
          <div class="grid-info">
            <span class="grid-label">Humidité</span>
            <span class="grid-value" id="humidity-val">--%</span>
          </div>
        </div>
        <!-- UV Index -->
        <div class="grid-item">
          <div class="grid-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4l3 3"></path></svg>
          </div>
          <div class="grid-info">
            <span class="grid-label">Indice UV</span>
            <span class="grid-value" id="uv-val">--</span>
          </div>
        </div>
      </div>

      <!-- 3-Day Forecast -->
      <div class="forecast-section">
        <div class="forecast-title">Prévisions 3 Jours</div>
        <div class="forecast-list" id="forecast-list">
          <!-- Dynamically inserted forecast items -->
        </div>
      </div>
    </div>

  </div>

  <!-- SVG Icon Library Helper -->
  <script>
    const SVGIcons = {
      'sun': `<svg class="weather-icon-svg" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`,
      'cloud-sun': `<svg class="weather-icon-svg" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v2M4.93 4.93l1.41 1.41M20 12h2M17.66 17.66l1.41 1.41M12 20v2M6.34 17.66l-1.41 1.41M4 12H2M6.34 6.34L4.93 4.93M17 18h1a4 4 0 0 0 0-8h-1.25a5 5 0 1 0-8.59 5.34"></path></svg>`,
      'cloud': `<svg class="weather-icon-svg" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path></svg>`,
      'cloud-fog': `<svg class="weather-icon-svg" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0-5.5-4.5-10-10-10S0 4.5 0 10h20zM2 14h20M6 18h12M10 22h4"></path></svg>`,
      'cloud-drizzle': `<svg class="weather-icon-svg" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0-5.5-4.5-10-10-10S0 4.5 0 10h20zM8 14v4M12 14v4M16 14v4"></path></svg>`,
      'cloud-rain': `<svg class="weather-icon-svg" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 13a4 4 0 0 1-8 0V6a4 4 0 1 1 8 0v7zM12 20v2M8 20v2M16 20v2"></path></svg>`,
      'cloud-rain-heavy': `<svg class="weather-icon-svg" viewBox="0 0 24 24" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10A8 8 0 1 0 4 10h16zM10 14l-2 4M14 14l-2 4M18 14l-2 4"></path></svg>`,
      'cloud-lightning': `<svg class="weather-icon-svg" viewBox="0 0 24 24" fill="none" stroke="#facc15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 16.9A5 5 0 0 0 18 7h-1.26a8 8 0 1 0-11.62 8.58M13 11l-4 6h6l-3 5"></path></svg>`
    };

    const weatherCodes = {
      0: { label: 'Ensoleillé', icon: 'sun' },
      1: { label: 'Dégagé', icon: 'sun' },
      2: { label: 'Partiellement nuageux', icon: 'cloud-sun' },
      3: { label: 'Couvert', icon: 'cloud' },
      45: { label: 'Brouillard', icon: 'cloud-fog' },
      48: { label: 'Brouillard givrant', icon: 'cloud-fog' },
      51: { label: 'Bruine légère', icon: 'cloud-drizzle' },
      53: { label: 'Bruine modérée', icon: 'cloud-drizzle' },
      55: { label: 'Bruine dense', icon: 'cloud-drizzle' },
      61: { label: 'Pluie faible', icon: 'cloud-rain' },
      63: { label: 'Pluie modérée', icon: 'cloud-rain' },
      65: { label: 'Pluie forte', icon: 'cloud-rain' },
      80: { label: 'Averses légères', icon: 'cloud-rain-heavy' },
      81: { label: 'Averses modérées', icon: 'cloud-rain-heavy' },
      82: { label: 'Averses violentes', icon: 'cloud-rain-heavy' },
      95: { label: 'Orage', icon: 'cloud-lightning' }
    };

    function getWeatherInfo(code) {
      return weatherCodes[code] || { label: 'Nuageux', icon: 'cloud' };
    }

    function getWindDirection(deg) {
      if (deg === undefined) return '';
      const directions = ['N', 'NE', 'E', 'SE', 'S', 'SO', 'O', 'NO'];
      const index = Math.round(deg / 45) % 8;
      return directions[index];
    }
  </script>

  <!-- Script for fetching data -->
  <script>
    // Extract Capibara token from query params
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('capibara_token') || '';

    // Pass token to configuration link
    const configLink = document.getElementById('config-link');
    configLink.href = `settings.html${token ? `?capibara_token=${encodeURIComponent(token)}` : ''}`;

    const loadingState = document.getElementById('loading-state');
    const emptyState = document.getElementById('empty-state');
    const errorState = document.getElementById('error-state');
    const weatherContent = document.getElementById('weather-content');
    const errorMsg = document.getElementById('error-msg');

    let coords = null;

    async function fetchWeather() {
      loadingState.style.display = 'block';
      emptyState.style.display = 'none';
      errorState.style.display = 'none';
      weatherContent.style.display = 'none';

      try {
        // 1. Fetch settings from local backend
        const settingsUrl = `/api/settings${token ? `?capibara_token=${encodeURIComponent(token)}` : ''}`;
        const headers = {};
        if (token) {
          headers['Authorization'] = `Bearer ${token}`;
        }
        
        const settingsRes = await fetch(settingsUrl, { headers });
        if (!settingsRes.ok) {
          throw new Error('Erreur lors de la récupération des coordonnées.');
        }

        const settingsData = await settingsRes.json();
        if (!settingsData.settings || !settingsData.settings.latitude) {
          // No settings saved -> show configure invitation
          loadingState.style.display = 'none';
          emptyState.style.display = 'block';
          return;
        }

        const { city, latitude, longitude } = settingsData.settings;
        document.getElementById('city-title').innerText = city.split(',')[0];

        // 2. Fetch from Open-Meteo
        const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,rain,showers,snowfall,weather_code,cloud_cover,wind_speed_10m,wind_direction_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,uv_index_max&timezone=auto`);
        
        if (!weatherRes.ok) {
          throw new Error('Erreur de connexion avec Open-Meteo.');
        }

        const weatherData = await weatherRes.json();
        renderWeather(weatherData);

      } catch (err) {
        console.error(err);
        loadingState.style.display = 'none';
        errorMsg.innerText = err.message;
        errorState.style.display = 'block';
      }
    }

    function renderWeather(data) {
      const current = data.current;
      const daily = data.daily;

      // 1. Weather Info
      const info = getWeatherInfo(current.weather_code);
      document.getElementById('weather-desc').innerText = info.label;
      document.getElementById('weather-icon').innerHTML = SVGIcons[info.icon] || SVGIcons['cloud'];

      // 2. Temperatures
      document.getElementById('temp-val').innerText = Math.round(current.temperature_2m);
      
      // Date string in French
      const dateOptions = { weekday: 'long', day: 'numeric', month: 'long' };
      document.getElementById('date-label').innerText = new Date().toLocaleDateString('fr-FR', dateOptions);

      // 3. Grid Metrics
      document.getElementById('wind-val').innerText = `${Math.round(current.wind_speed_10m)} km/h ${getWindDirection(current.wind_direction_10m)}`;
      document.getElementById('rain-val').innerText = `${current.precipitation} mm`;
      document.getElementById('humidity-val').innerText = `${current.relative_humidity_2m}%`;
      document.getElementById('uv-val').innerText = daily.uv_index_max[0] !== undefined ? daily.uv_index_max[0].toFixed(1) : '--';

      // 4. Daily Forecast (Next 3 Days: tomorrow, day+1, day+2)
      const forecastList = document.getElementById('forecast-list');
      forecastList.innerHTML = '';

      for (let i = 1; i <= 3; i++) {
        const timeVal = daily.time[i];
        if (!timeVal) break;

        const dayName = new Date(timeVal).toLocaleDateString('fr-FR', { weekday: 'short' });
        const dayCode = daily.weather_code[i];
        const dayInfo = getWeatherInfo(dayCode);
        const maxTemp = Math.round(daily.temperature_2m_max[i]);
        const minTemp = Math.round(daily.temperature_2m_min[i]);

        const forecastItem = document.createElement('div');
        forecastItem.className = 'forecast-item';
        forecastItem.innerHTML = `
          <span class="forecast-day" style="text-transform: capitalize;">${dayName}</span>
          <div class="forecast-icon-box" title="${dayInfo.label}">
            ${SVGIcons[dayInfo.icon] || SVGIcons['cloud']}
          </div>
          <div class="forecast-temp-range">
            <span class="forecast-temp-max">${maxTemp}°</span>
            <span class="forecast-temp-min">${minTemp}°</span>
          </div>
        `;
        forecastList.appendChild(forecastItem);
      }

      // Show content
      loadingState.style.display = 'none';
      weatherContent.style.display = 'block';
    }

    // Initial Fetch
    fetchWeather();
  </script>
</body>
</html>
